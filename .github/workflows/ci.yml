name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install Postman converter dependencies
        run: npm ci --prefix scripts

      - name: Install browser dependencies
        run: npm ci --prefix webapp

      - name: Install AWS deployment dependencies
        run: npm ci --prefix deploy/aws

      - name: Test TypeScript backend
        run: npm test

      - name: Build browser application
        run: npm run build:web

      - name: Test AWS deployment
        run: npm test --prefix deploy/aws
        env:
          AACF_DOMAIN_NAME: pcg.example.com
          AACF_HOSTED_ZONE_ID: Z0123456789EXAMPLE
          AACF_HOSTED_ZONE_NAME: example.com
          AACF_CERTIFICATE_ARN: arn:aws:acm:us-east-1:111122223333:certificate/example

      - name: Build Java converter
        run: ./gradlew test installDist
        shell: bash

      - name: Audit backend dependencies
        run: npm audit --prefix backend --audit-level=high

      - name: Audit Postman converter dependencies
        shell: bash
        run: |
          set +e
          AUDIT_OUTPUT=$(npm audit --prefix scripts --audit-level=high --json)
          set -e
          echo "$AUDIT_OUTPUT" | node scripts/ci-audit-check.mjs

      - name: Audit browser dependencies
        run: npm audit --prefix webapp --audit-level=high

      - name: Audit AWS deployment dependencies
        run: npm audit --prefix deploy/aws --audit-level=high

      - name: Remediate package vulnerability
        run: npm audit fix
